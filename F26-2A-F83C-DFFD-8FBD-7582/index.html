<body>
    <main>
        <h1>Diário de Bordo</h1>
        
        <form id="logForm">
            <textarea id="conteudo" placeholder="Descreva a atividade..." required></textarea>
            <select id="impedimento">
                <option value="nenhum">Sem impedimento</option>
                <option value="atencao">Atenção (Parcial)</option>
                <option value="bloqueado">Bloqueado</option>
            </select>
            <button type="submit">Registar</button>
        </form>

        <section id="timeline">
            <!-- Os registos serão inseridos aqui via JavaScript puro -->
        </section>
    </main>

    <!-- Rodapé obrigatório para rastreabilidade -->
